name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zsh_version:
          - zsh-5.7
          - zsh-5.6
          - zsh-5.5
          - zsh-5.4.2
          - zsh-5.4.1
          - zsh-5.4
          - zsh-5.3.1
          - zsh-5.3
          - zsh-5.2
          - zsh-5.1.1
          - zsh-5.0.0
          - zsh-4.3.17
          - zsh-4.3.11
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests in Docker Container
        run: |
          make info tests stats USE_CONTAINER=docker ZSH_VERSION=${{ matrix.zsh_version }}

      - name: Verify Build Integrity
        run: |
          SHASUM=$(shasum -a 256 ./bin/antigen.zsh)
          VERSION=$(cat ./VERSION) make build USE_CONTAINER=docker ZSH_VERSION=${{ matrix.zsh_version }}
          SHACHECK=$(shasum -a 256 ./bin/antigen.zsh)
          echo "Original: $SHASUM"
          echo "Rebuilt:  $SHACHECK"
          test "$SHASUM" == "$SHACHECK"

  test-local:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Cram
        run: |
          python3 -m venv venv
          venv/bin/pip install cram

      - name: Run Local Tests
        run: |
          make build
          ZDOTDIR=$(pwd)/tests ANTIGEN=$(pwd) venv/bin/cram -v --shell=zsh tests
